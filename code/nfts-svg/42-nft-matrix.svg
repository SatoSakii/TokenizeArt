      <stop offset="0%" stop-color="#020403"/>
      <stop offset="100%" stop-color="#031a0d"/>
    </linearGradient>

    <pattern id="scan" width="400" height="4" patternUnits="userSpaceOnUse">
      <rect width="400" height="2" fill="#00ff66" opacity="0.04"/>
      <rect y="2" width="400" height="2" fill="#000000" opacity="0.15"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
