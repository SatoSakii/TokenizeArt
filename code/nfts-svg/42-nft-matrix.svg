    <g id="mark">
      <polygon points="199.02 10.53 139.48 10.53 20.39 129.61 20.39 177.82 139.48 177.82 139.48 237.36 199.02 237.36 199.02 129.61 79.94 129.61 199.02 10.53"/>
      <polygon points="224.54 70.07 284.08 10.53 224.54 10.53 224.54 70.07"/>
      <polygon points="343.62 70.07 343.62 10.53 284.08 10.53 284.08 70.07 224.54 129.61 224.54 189.16 284.08 189.16 284.08 129.61 343.62 70.07"/>
      <polygon points="343.62 129.61 284.08 189.16 343.62 189.16 343.62 129.61"/>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#scan)"/>
  <text x="10" y="30" font-family="monospace" font-size="14" fill="#00ff66" opacity="0.35">101010</text>
  <text x="10" y="385" font-family="monospace" font-size="14" fill="#00ff66" opacity="0.35">ft_NFT</text>

  <g transform="translate(70,108.75) scale(0.8045) translate(-20.39,-10.53)" filter="url(#glow)">
    <use href="#mark" fill="#ff2b6d" transform="translate(-5,0)" opacity="0.75"/>
    <use href="#mark" fill="#00e5ff" transform="translate(5,3)" opacity="0.75"/>
    <use href="#mark" fill="#00ff66"/>
