<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%"  stop-color="#1a1408"/>
      <stop offset="70%" stop-color="#0a0805"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff6d8"/>
      <stop offset="25%"  stop-color="#e6c05c"/>
      <stop offset="50%"  stop-color="#8a5a1f"/>
      <stop offset="75%"  stop-color="#f3d27a"/>
      <stop offset="100%" stop-color="#c9973b"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.3"/>

  <g fill="url(#gold)" filter="url(#glow)"
     transform="translate(70,108.75) scale(0.8045) translate(-20.39,-10.53)">
    <polygon points="199.02 10.53 139.48 10.53 20.39 129.61 20.39 177.82 139.48 177.82 139.48 237.36 199.02 237.36 199.02 129.61 79.94 129.61 199.02 10.53"/>
    <polygon points="224.54 70.07 284.08 10.53 224.54 10.53 224.54 70.07"/>
    <polygon points="343.62 70.07 343.62 10.53 284.08 10.53 284.08 70.07 224.54 129.61 224.54 189.16 284.08 189.16 284.08 129.61 343.62 70.07"/>
    <polygon points="343.62 129.61 284.08 189.16 343.62 189.16 343.62 129.61"/>
  </g>

  <rect width="400" height="400" fill="url(#vignette)"/>
</svg>